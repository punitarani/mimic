name: Setup
description: pnpm and Node 22 (the versions pinned in package.json), with the pnpm store cached, then a frozen install.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
