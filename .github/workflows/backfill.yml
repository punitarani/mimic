# Run predictors over questions served before they existed (ADR-0024), against prod, from the Actions tab:
# Actions → Backfill → Run workflow. A dry run unless "enqueue" is checked: it prints the missing count per scope and
# a cost estimate from what the model has cost so far, and how its failures split between unusable output and failed
# calls. Enqueued predictions run at "rate" a minute (ADR-0037). Re-run the dry run to watch the count fall to 0.

name: Backfill

on:
  workflow_dispatch:
    inputs:
      predictors:
        description: Predictor IDs, comma-separated, e.g. llm:qwen/qwen3.8-flash@predict.v1-direct,llm:xiaomi/mimo-v2.6-flash
        required: true
        type: string
      scope:
        description: Which mimics
        type: choice
        options: [consented, all]
        default: consented
      rate:
        description: Predictions a minute, per predictor (the worker spaces them out)
        type: string
        default: '30'
      retry_failed:
        description: Also redo failed calls (rate limits, provider errors); unusable output and timeouts are kept
        type: boolean
        default: false
      enqueue:
        description: Enqueue the backfill (unchecked is a dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backfill-production
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill ${{ inputs.predictors }} (prod)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Dependency-free Node script: no install needed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backfill
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREDICTORS: ${{ inputs.predictors }}
          SCOPE: ${{ inputs.scope }}
          RATE: ${{ inputs.rate }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
          ENQUEUE: ${{ inputs.enqueue }}
        # Inputs reach the script as environment variables, never interpolated into the shell.
        run: |
          set -o pipefail
          args=(--predictor "$PREDICTORS" --env prod --rate "$RATE")
          [ "$SCOPE" = consented ] && args+=(--consented)
          [ "$RETRY_FAILED" = true ] && args+=(--retry-failed)
          [ "$ENQUEUE" = true ] && args+=(--yes)
          node scripts/backfill.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
