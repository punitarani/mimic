# Relabel stored predictor IDs for ADR-0054 against prod, from the Actions tab: Actions → Relabel predictors → Run
# workflow. Run it after CD has deployed ADR-0054 (old code still writes `jev:`). A dry run unless "apply" is checked:
# it counts the `jev:` rows to rename `decision:`, shadows stored under both spellings, and span-01 answers stored
# under Jev's ID. Applied, it rewrites them in batches; a dry run afterwards should count 0 everywhere.
# "reverse" renames `decision:` back to `jev:`, for a code rollback: run it once the rollback deploy has finished.

name: Relabel predictors

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the relabel (unchecked is a dry run)
        type: boolean
        default: false
      reverse:
        description: 'Reverse it (decision: back to jev:), only after rolling the code back'
        type: boolean
        default: false
      batch:
        description: Rows per statement
        type: string
        default: '500'

permissions:
  contents: read

concurrency:
  group: relabel-production
  cancel-in-progress: false

jobs:
  relabel:
    name: Relabel predictor IDs (prod)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Dependency-free Node script: no install needed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relabel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLY: ${{ inputs.apply }}
          REVERSE: ${{ inputs.reverse }}
          BATCH: ${{ inputs.batch }}
        # Inputs reach the script as environment variables, never interpolated into the shell.
        run: |
          set -o pipefail
          args=(--env prod --batch "$BATCH")
          [ "$REVERSE" = true ] && args+=(--reverse)
          [ "$APPLY" = true ] && args+=(--yes)
          node scripts/relabel-predictors.mjs "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
