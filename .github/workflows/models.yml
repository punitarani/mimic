# E8: decision models compared (docs/MODELS.md, ADR-0068), from the Actions tab: Actions → Decision models → Run
# workflow. Jev, span-01 (OpenRouter), Cloudflare's clef and clef-flash (Workers AI) and Perplexity's decider each
# predict the same sealed instances from the same state, in the same requests, and from the context alone. The step
# summary and /lab hold the readout: quality after a temperature per model fitted leaving each person out, each model
# against Jev, what the answers add, a pairwise table, by question type, latency, cost and errors, and MODELS_RULE's
# verdict. A canary request per model runs first and stops the run, before anything else is spent, if a key or a
# permission is missing.
#
# Data: the prod export (consented mimics only, scrubbed of names, locations and links; ADR-0018; real people's served
# questions only) and Twin-2K-500 people (public survey answers from real people; wave 4 held out, k = 30). Only
# aggregates leave the runner: the step summary, /lab and the artifact (the report, and the canary's synthetic
# requests and responses). Per-question records, traces and the export are discarded with the runner. Models are
# live, capped at max_usd; people run in chunks with every model, so a cap never leaves models on different questions.
#
# Keys: OPENROUTER_API_KEY; CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN, with Account · Workers AI · Read on the
# token; PERPLEXITY_API_KEY (docs/DEPLOY.md).

name: Decision models

on:
  workflow_dispatch:
    inputs:
      data:
        description: prod (served questions), twin (Twin-2K-500 people) or both; the verdict needs both
        type: choice
        options: [prod, twin, both]
        default: both
      twin_people:
        description: Twin-2K-500 people to include (with twin or both)
        type: string
        default: '200'
      predictors:
        description: Decision predictors, comma-separated, the reference first (empty is all five, Jev first)
        type: string
        default: ''
      max_usd:
        description: Spend cap in USD for every model together
        type: string
        default: '5'
      publish:
        description: Publish the readout to /lab
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: models-production
  cancel-in-progress: false

jobs:
  models:
    name: E8 decision models (${{ inputs.data }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The export and publishing to /lab both need the prod resource config.
      - name: Prod config
        if: inputs.data != 'twin' || inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:config --env prod

      - name: Export prod (consented, scrubbed)
        if: inputs.data != 'twin'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm eval -- export --env prod --out data/prod.sqlite

      - name: Twin-2K-500
        if: inputs.data != 'prod'
        env:
          TWIN_PEOPLE: ${{ inputs.twin_people }}
        run: |
          python -m pip install --quiet datasets
          python - <<'EOF'
          import os
          import datasets
          n = int(os.environ["TWIN_PEOPLE"])
          ds = datasets.load_dataset("LLM-Digital-Twin/Twin-2K-500", "wave_split")["data"]
          ds.select(range(min(n, len(ds)))).to_json("data/twin.jsonl")
          EOF
          pnpm eval -- import twin2k500 --path data/twin.jsonl --out data/twin.sqlite

      - name: Decision models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PREDICTORS: ${{ inputs.predictors }}
          MAX_USD: ${{ inputs.max_usd }}
          PUBLISH: ${{ inputs.publish }}
        # Inputs reach the script as environment variables, never interpolated into the shell.
        run: |
          data=""
          for f in data/prod.sqlite data/twin.sqlite; do [ -f "$f" ] && data="${data:+$data,}$f"; done
          args=(--data "$data" --max-usd "$MAX_USD" --out data/models/run --summary "$GITHUB_STEP_SUMMARY")
          [ -n "$PREDICTORS" ] && args+=(--predictors "$PREDICTORS")
          [ "$PUBLISH" = true ] && args+=(--publish prod)
          pnpm eval -- models "${args[@]}"

      # The readout, and the canary's synthetic requests and responses (to re-record the adapter fixtures from).
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: models-result
          if-no-files-found: ignore
          retention-days: 30
          path: |
            data/reports/*/report.md
            data/models/run/canary.json
