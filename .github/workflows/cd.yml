# Deploy to Cloudflare, and only what CI already went green on.
#
# Triggered by CI completing on main (`workflow_run`), so "gated on CI" is structural: a red run never reaches this
# job. It checks out `workflow_run.head_sha`, not `main`: if two commits land close together, the second must not
# deploy on the first one's test result. Only pushes to this repo's main deploy; a fork's PR from a branch that
# happens to be called `main` also completes CI "on main", and must never run here with secrets.
#
# Every value comes from repository secrets, which Doppler (project mimic, config prd) syncs to GitHub. `scripts/deploy`
# does the rest (docs/DEPLOY.md):
#   preflight → find-or-create Cloudflare resources → D1 migrations → worker → web → Access for /lab → smoke test.
# Nothing is created by hand, and every step is idempotent, so a re-run is always safe. A Doppler change reaches the
# Workers on the next deploy; to apply one now, run this workflow by hand ("Run workflow" on main).

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one in flight: a half-applied migration or a half-rolled deploy is worse
# than waiting.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare (prod)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # A hung deploy holds the concurrency group, and the next release with it.
    timeout-minutes: 30
    environment:
      name: production
      url: https://mimic.punitarani.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Preflight comes first and fails in seconds, by name, before anything is touched: every name present,
      # settings valid, APP_URL is the custom domain, the Cloudflare token active. Values are never printed.
      - name: Preflight, resources, migrations, worker, web, Access, smoke test
        run: pnpm deploy:prod
        # Secrets are scoped to this step, not to the job's actions.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          INVITE_CODES: ${{ secrets.INVITE_CODES }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Provider keys: each is required only when its provider is selected (scripts/deploy/settings.mjs).
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          # Optional overrides of the settings in wrangler.jsonc: unset keeps the checked-in value, and preflight warns
          # about one that equals it. Spend caps and the decision model are Flagship flags (ADR-0052).
          VECTOR_BACKEND: ${{ secrets.VECTOR_BACKEND }}
          EMBEDDINGS_PROVIDER: ${{ secrets.EMBEDDINGS_PROVIDER }}
          SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
          ENRICH_PROVIDER: ${{ secrets.ENRICH_PROVIDER }}
